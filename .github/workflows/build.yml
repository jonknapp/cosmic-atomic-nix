name: build

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase repository names.
      - name: Set image repo
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=ghcr.io/${repo}" >> "${GITHUB_ENV}"

      # Pinned for reproducible CI. The sign step passes the format flags
      # explicitly, so cosign 2.6.x and 3.x produce the same legacy .sig
      # attachment that skopeo/bootc read.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.2

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${GITHUB_TOKEN}" | cosign login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build image
        run: |
          podman build --pull=always \
            --build-arg "IMAGE_REPO=${IMAGE_REPO}" \
            -t "${IMAGE_REPO}:latest" container/

      - name: Push image
        id: push
        run: |
          podman push "${IMAGE_REPO}:latest" --digestfile digest.txt
          echo "digest=$(cat digest.txt)" >> "${GITHUB_OUTPUT}"

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false --use-signing-config=false --new-bundle-format=false \
            "${IMAGE_REPO}@${{ steps.push.outputs.digest }}"

      # Signed without a transparency log entry, so skip the Rekor lookup.
      - name: Verify signature
        run: |
          cosign verify --key container/cosign.pub --insecure-ignore-tlog=true \
            "${IMAGE_REPO}@${{ steps.push.outputs.digest }}"
